<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- 背景金黃漸層（招財感）-->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff8d8"/>
      <stop offset="100%" stop-color="#ffd54a"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4c87a"/>
      <stop offset="100%" stop-color="#d99a3a"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#bg)" stroke="#b8801a" stroke-width="2"/>

  <!-- 左耳 -->
  <path d="M 28 36 Q 18 24 24 14 Q 34 18 40 32 Z" fill="url(#fur)" stroke="#6b3a14" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 30 30 Q 26 24 28 18 Q 33 22 36 30 Z" fill="#ffd5a5"/>
  <!-- 右耳 -->
  <path d="M 92 36 Q 102 24 96 14 Q 86 18 80 32 Z" fill="url(#fur)" stroke="#6b3a14" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 90 30 Q 94 24 92 18 Q 87 22 84 30 Z" fill="#ffd5a5"/>

  <!-- 臉 -->
  <ellipse cx="60" cy="64" rx="34" ry="32" fill="url(#fur)" stroke="#6b3a14" stroke-width="2"/>
  <!-- 嘴部白毛 -->
  <ellipse cx="60" cy="80" rx="20" ry="14" fill="#fff7e1" stroke="#6b3a14" stroke-width="1.5"/>

  <!-- 眼睛（含星星亮點） -->
  <ellipse cx="46" cy="62" rx="5" ry="6" fill="#2a1a08"/>
  <ellipse cx="74" cy="62" rx="5" ry="6" fill="#2a1a08"/>
  <circle cx="48" cy="60" r="1.6" fill="#fff"/>
  <circle cx="76" cy="60" r="1.6" fill="#fff"/>
  <!-- 笑笑下睫毛 -->
  <path d="M 41 65 Q 46 68 51 65" fill="none" stroke="#2a1a08" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 69 65 Q 74 68 79 65" fill="none" stroke="#2a1a08" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 鼻子 -->
  <ellipse cx="60" cy="74" rx="4.5" ry="3.5" fill="#2a1a08"/>
  <path d="M 60 78 L 60 84" stroke="#2a1a08" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 嘴 (招牌笑) -->
  <path d="M 60 84 Q 52 92 46 86" fill="none" stroke="#2a1a08" stroke-width="2" stroke-linecap="round"/>
  <path d="M 60 84 Q 68 92 74 86" fill="none" stroke="#2a1a08" stroke-width="2" stroke-linecap="round"/>
  <!-- 小舌頭 -->
  <path d="M 56 88 Q 60 94 64 88 L 64 86 L 56 86 Z" fill="#ff6b6b" stroke="#b8001a" stroke-width="1"/>

  <!-- 腮紅 -->
  <ellipse cx="34" cy="76" rx="6" ry="4" fill="#ff8da1" opacity="0.55"/>
  <ellipse cx="86" cy="76" rx="6" ry="4" fill="#ff8da1" opacity="0.55"/>

  <!-- 招財金幣 -->
  <g transform="translate(82 90)">
    <circle r="11" fill="#ffd700" stroke="#b8860b" stroke-width="2"/>
    <text y="4" text-anchor="middle" font-size="12" font-weight="900" fill="#b8860b"
          font-family="-apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif">財</text>
  </g>
</svg>
